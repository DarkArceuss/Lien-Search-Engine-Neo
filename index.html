<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lien - private and simple search engine</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html, body {
      min-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin: 0;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .container {
      width: min(470px, calc(100vw - 20px));
      padding-top: 5vh;
      padding-bottom: 30px;
    }

    .container > img:first-child {
      width: 460px;
      max-width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      padding-top: 5px;
      padding-bottom: 10px;
      border-radius: 20px;
      margin: 0 auto;
      box-sizing: border-box;
      filter: grayscale(1) contrast(1.1);
      transition: filter .4s ease, transform .4s ease;
    }

    .container > img:first-child:hover {
      filter: grayscale(0);
      transform: scale(1.02);
    }

    .container1 {
      position: relative;
      width: 100%;
    }

    .container1 input {
      width: 100%;
      height: 42px;
      box-sizing: border-box;
      border-radius: 22px;
      border: 1px solid #2a2a2a;
      padding: 0 52px 0 16px;
      font-size: 15px;
      outline: none;
      background: #141414;
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
      caret-color: #ffffff;
      transition: border-color .3s ease, box-shadow .3s ease;
    }

    .container1 input:focus {
      border-color: #f5f5f5;
      box-shadow: 0 0 0 3px rgba(245,245,245,.08);
    }

    .container1 input::placeholder {
      color: #ffffff !important;
      opacity: 1;
    }

    .container1 input:-webkit-autofill,
    .container1 input:-webkit-autofill:hover,
    .container1 input:-webkit-autofill:focus {
      -webkit-text-fill-color: #ffffff !important;
      caret-color: #ffffff;
      transition: background-color 9999s ease-out 0s;
    }

    .container1 button {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 0;
      background: transparent;
      padding: 6px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    .container1 button:hover {
      transform: scale(1.08);
      background: #000000;
    }

    .container1 button:active {
      transform: scale(.96);
    }

    .container1 button img {
      display: block;
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .container p {
      display: flex;
      justify-content: center;
      color: #9a9a9a;
      text-align: center;
      margin: 10px 0;
    }

    .search-result-select {
      display: block;
      width: 100%;
      height: 38px;
      box-sizing: border-box;
      border-radius: 20px;
      background: #141414;
      color: #f5f5f5;
      border: 1px solid #2a2a2a;
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      appearance: auto;
      cursor: pointer;
      transition: border-color .3s ease;
    }

    .search-result-select:hover,
    .search-result-select:focus {
      border-color: #f5f5f5;
    }

    .container a {
      display: flex;
      justify-content: center;
      padding-top: 10px;
      color: #9a9a9a;
      text-decoration: none;
      transition: color .3s ease;
    }

    .container a:hover {
      color: #f5f5f5;
      text-decoration: underline;
    }

    hr {
      border: 0;
      border-top: 1px solid rgba(245,245,245,.12);
      margin: 18px 0;
    }

    .promo-image {
      width: 100%;
      height: auto;
      max-height: 260px;
      object-fit: cover;
      display: block;
      border-radius: 20px;
      filter: grayscale(1) contrast(1.1);
      transition: filter .4s ease, transform .4s ease;
    }

    .promo-image:hover {
      filter: grayscale(0);
      transform: scale(1.02);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .container > img:first-child,
    .container1,
    .container p,
    .search-result-select,
    hr,
    .promo-image,
    .container a {
      animation: fadeUp .6s ease both;
    }

    .container1              { animation-delay: .1s; }
    .container p             { animation-delay: .2s; }
    .search-result-select    { animation-delay: .3s; }
    .container hr            { animation-delay: .4s; }
    .promo-image             { animation-delay: .5s; }
    .container a             { animation-delay: .6s; }

    @media (max-width: 500px) {
      .container { width: calc(100vw - 20px); }
      .container > img:first-child { height: auto; max-height: 200px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://i.ibb.co/bgpwqfgr/Untitled60-20260918095055.png" alt="Lien">
    <form id="search-form" action="/search" method="GET">
      <div class="container1">
        <input name="q" class="text" placeholder="Search..." autocomplete="off">
        <button type="submit" aria-label="Search">
          <img src="https://i.ibb.co/r28GNFXF/Untitled56-20260917190920.png" alt="">
        </button>
      </div>
    </form>
    <p>Lien - private search engine, find your sh*t here...</p>
    <select class="search-result-select" name="type" form="search-form" aria-label="Search type">
      <option value="clear">Clear sites</option>
      <option value="onion">.onion sites</option>
    </select>
    
    <hr>
    <p>Search engine By:</p><a href="https://t.me/booink1" rel="noreferrer">Boink(Telegram)</a>
    <hr>
  </div>
</body>
</html>
